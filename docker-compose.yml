# Dev only: the database. The API and the worker run on the host (uv) during development.
# Object storage is the real Linode bucket (docs/recitations.md), so there's no local S3.
# Production packaging comes later (phase 9).
name: mojawid

services:
  mojawid_postgres:
    image: postgres:17
    container_name: mojawid_postgres
    environment:
      POSTGRES_USER: mojawid
      POSTGRES_PASSWORD: mojawid
      POSTGRES_DB: mojawid
    ports:
      - "127.0.0.1:5452:5432"
    volumes:
      - mojawid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mojawid -d mojawid"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mojawid_pgdata:
