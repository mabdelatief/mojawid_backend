[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os
# Revision files: <YYYYMMDD_NNNN>_<slug>.py (see /new-migration).
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is left empty on purpose: env.py takes it from MOJAWID_DATABASE_URL, unless a
# caller (the test suite) sets it explicitly.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
