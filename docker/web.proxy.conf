# Proxy settings for the API locations in web.nginx.conf.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
# The API believes CF-Connecting-IP (set by Cloudflare, passed through) only from this server's
# fixed address. A client's own X-Forwarded-For is dropped.
proxy_set_header X-Forwarded-For "";

# The API refuses anything over 2 MiB with its own error code; this only has to let that through.
client_max_body_size 3m;
client_body_buffer_size 3m;
# Stream the recording to the API instead of collecting it first (no temp file, ever).
proxy_request_buffering off;

# A result is a few hundred KB; keep it in memory.
proxy_buffer_size 64k;
proxy_buffers 16 64k;
proxy_max_temp_file_size 0;

proxy_connect_timeout 5s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
