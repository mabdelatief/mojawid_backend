# The public front of the laptop deployment (docs/deploy-laptop.md). cloudflared sends
# tajweed.codavvy.com here (everything but /mojawid/, which goes to the review page). This
# serves the Flutter web build and passes /v1 and /healthz to the API on the compose network.
#
# Nothing a user sends is written to disk: request bodies (the recording) stream straight to
# the API, and responses never spill into temp files. The log has no query strings (an
# analysis' settings) and no addresses.

log_format mojawid '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout mojawid;
    server_tokens off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    location /v1/ {
        proxy_pass http://mojawid_api:8100;
        include /etc/nginx/mojawid_proxy.conf;
    }

    location = /healthz {
        proxy_pass http://mojawid_api:8100;
        include /etc/nginx/mojawid_proxy.conf;
    }

    # The admin page stays on the home Wi-Fi (192.168.1.17:8100/admin); the review page is
    # routed by the tunnel and never reaches this server.
    location /admin { return 404; }
    location /mojawid { return 404; }

    # The web build. Any path without a file extension is an app route (path URL strategy) and
    # gets index.html; a missing file is a 404.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "microphone=(self)" always;
        # main.dart.js and most of the build keep their names across builds, so everything is
        # revalidated (ETag) rather than cached blind; an update shows at once.
        add_header Cache-Control no-cache always;

        try_files $uri $uri/ /index.html;

        location ~ \.[A-Za-z0-9]+$ {
            try_files $uri =404;
        }
    }
}
