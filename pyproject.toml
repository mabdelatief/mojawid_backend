[project]
name = "mojawid-backend"
version = "0.1.0"
description = "Backend for Mojawid, a free Quran recitation practice app"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Shared by the API and the worker.
dependencies = [
  "fastapi>=0.120",
  # The patched copy in vendor/ (MUAALEM_PATCHES.md), never PyPI: it changes the expected reading.
  "quran-transcript==0.6.4+muaalem.1",
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "uvicorn[standard]>=0.38",
]

[project.optional-dependencies]
# The public API. Never torch: the worker extra is the only one that brings the model stack.
api = [
  "alembic>=1.17",
  "asyncpg>=0.30",
  "sqlalchemy[asyncio]>=2.0.44",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "ruff>=0.14",
]

[tool.uv]
package = false

[tool.uv.sources]
quran-transcript = { path = "vendor/quran-transcript" }

[tool.ruff]
line-length = 100
target-version = "py312"
# `.claude/` holds the agent tooling (hooks, discipline scanner); it runs on the host python and
# is not part of the service.
extend-exclude = [".claude", ".cache", "vendor"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "ASYNC",
  "SIM",
  # Complexity / function-size caps from CLAUDE.md "Limits & complexity"
  "C901",    # cyclomatic complexity
  "PLR0911", # too-many-return-statements
  "PLR0912", # too-many-branches
  "PLR0913", # too-many-arguments
  "PLR0915", # too-many-statements
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/versions/*.py" = [
  "E501",
  "I001",
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
]
# Nothing else, on purpose: refactor to fit the caps instead of adding entries here (the
# discipline scan blocks new ones).

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Migrations stay exactly as Alembic generated them (CLAUDE.md); they are still linted.
exclude = ["app/db/migrations/versions/*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["app", "tests"]
exclude = ["^tools/", "^\\.claude/", "^vendor/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["asyncpg.*", "quran_transcript.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["slow: whole-Quran sweeps; run with -m slow"]
addopts = "-m 'not slow'"
